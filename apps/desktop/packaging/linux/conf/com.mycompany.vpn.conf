<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>
    <!-- Root can own the service name on system bus -->
    <policy user="root">
        <allow own="com.mycompany.Vpn"/>
        <allow send_destination="com.mycompany.Vpn"/>
    </policy>

    <!-- Development user can also own and talk in dev mode if needed -->
    <policy user="kalimain">
        <allow own="com.mycompany.Vpn"/>
        <allow send_destination="com.mycompany.Vpn"/>
    </policy>

    <!-- Default: allow all authenticated local users to call methods on the VPN daemon -->
    <policy context="default">
        <allow send_destination="com.mycompany.Vpn"/>
        <allow receive_sender="com.mycompany.Vpn"/>
    </policy>
</busconfig>


