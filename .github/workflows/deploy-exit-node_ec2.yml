#! a lot of name hardcoding here
#! espacially in directories for releases
#! and also a lot of things are manual

name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      # - name: Prune workspace
      #   run: |
      #     pnpm turbo prune server

      - name: Build exit-node
        run: |
          pnpm turbo build --filter=server


      - name: Create deployment
        run: |
          rm -rf ./deploy

          pnpm deploy \
            --filter=server \
            --prod \
            ./deploy

      - name: Inspect deployment
        run: |
          echo "Deployment size:"
          du -sh deploy

          echo ""
          echo "Deployment contents:"
          find deploy -maxdepth 3 -type f | sort
      - name: Package deployment
        run: |
          tar -czf exit-node.tar.gz -C deploy .
  
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_METRO_VPN_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "echo Connected successfully"
      - name: Upload deployment
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            exit-node.tar.gz \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }}:/tmp/exit-node-${{ github.sha }}.tar.gz
      - name: Create release directory
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "sudo mkdir -p /opt/releases/${{ github.sha }}"

      - name: Extract deployment
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "sudo tar -xzf /tmp/exit-node-${{ github.sha }}.tar.gz -C /opt/releases/${{ github.sha }}"

      - name: Update current release
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "sudo ln -sfn /opt/releases/${{ github.sha }} /opt/releases/current"

      - name: Restart VPN exit node
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "sudo systemctl restart vpn-exit-node.service"

      - name: Verify VPN exit node service
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "sudo systemctl is-active --quiet vpn-exit-node.service"

      - name: Verify current release
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_METRO_VPN_USER }}@${{ secrets.EC2_METRO_VPN_HOST }} \
            "echo 'Current release:' && sudo readlink -f /opt/releases/current && echo 'Expected release:' && echo /opt/releases/${{ github.sha }}"

